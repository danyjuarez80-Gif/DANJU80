name: Separar y Sincronizar M3U desde Dropbox

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  sync_and_split:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista completa desde Dropbox
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"

      - name: Separar M3U en TV, Películas y Series
        run: |
          # Crear cabeceras estándar para los 3 archivos m3u
          echo "#EXTM3U" > tv.m3u
          echo "#EXTM3U" > peliculas.m3u
          echo "#EXTM3U" > series.m3u

          # Script de reconstrucción limpia: Extrae solo categoría y nombre
          python3 -c "
          import re

          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          current_extinf = None
          
          for line in lines:
              line_strip = line.strip()
              if not line_strip:
                  continue
              
              if line_strip.startswith('#EXTINF:'):
                  # 1. Buscamos la categoría (group-title) usando comillas dobles o simples
                  match_group = re.search(r'group-title=[\"\']([^\"\']+)[\"\']', line_strip, re.IGNORECASE)
                  # 2. Buscamos el nombre del canal (después de la última coma)
                  match_name = re.search(r',([^,]*)$', line_strip)
                  # 3. Buscamos la duración original
                  match_dur = re.search(r'^#EXTINF:(\s*[-]?\d+)', line_strip)
                  
                  duracion = match_dur.group(1) if match_dur else '-1'
                  nombre = match_name.group(1).strip() if match_name else 'Sin Nombre'
                  
                  if match_group:
                      categoria = match_group.group(1).strip()
                      # Reconstruimos la línea de TV DEJANDO SOLO la categoría y el nombre
                      current_extinf = f'#EXTINF:{duracion} group-title=\"{categoria}\",{nombre}\n'
                  else:
                      # Si por alguna razón no tiene categoría, dejamos solo duración y nombre
                      current_extinf = f'#EXTINF:{duracion},{nombre}\n'
                      
              elif line_strip.startswith('http'):
                  if current_extinf:
                      url_low = line_strip.lower()
                      
                      # Tu clasificación exacta por patrones de Xtream Codes
                      if '/movie/' in url_low:
                          # Para películas limpiamos el grupo para dejarlo directo en VOD
                          peli_limpia = re.sub(r'group-title=\".*?\"', '', current_extinf).replace(' ,', ',').strip() + '\n'
                          with open('peliculas.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(peli_limpia + line_strip + '\n')
                      elif '/series/' in url_low:
                          # Para series limpiamos el grupo
                          serie_limpia = re.sub(r'group-title=\".*?\"', '', current_extinf).replace(' ,', ',').strip() + '\n'
                          with open('series.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(serie_limpia + line_strip + '\n')
                      else:
                          # TV EN VIVO: Se guarda con la línea reconstruida ultra-limpia (Solo categoría y nombre)
                          with open('tv.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(current_extinf + line_strip + '\n')
                      current_extinf = None
          "
          # Eliminar el archivo pesado original
          rm completa.m3u

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add tv.m3u peliculas.m3u series.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Listas divididas: TV con categorias puras sin logos" && git push)
