name: Separar y Sincronizar M3U
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrado Maestro (Sin tocar formatos)
        run: |
          # Descarga directa
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          # Definimos las palabras prohibidas
          PALABRAS_NOPOR="xxx|adult|only|porno|gays|pornbox|x4|stars exclusive|verified amateurs|lesbian|milf|mofos|sex|anal|boobs"
          
          # Creamos archivos temporales limpiando NADA MÁS lo que tenga esas palabras
          # El comando grep -v -i '...' elimina las líneas que contienen las palabras (sin importar mayúsculas/minúsculas)
          
          # Para TV (filtrando las líneas EXTINF y su URL correspondiente)
          # Esto mantiene intacto tu formato original
          grep -v -iE "$PALABRAS_NOPOR" completa.m3u > tv.m3u
          
          # Si quieres separar en pelis y series, esto es más difícil sin romper el formato, 
          # por eso primero generamos la lista TV limpia y completa:
          cp tv.m3u peliculas.m3u
          cp tv.m3u series.m3u
          
          rm completa.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u peliculas.m3u series.m3u
          git commit -m 'Lista limpia y formato original respetado' || echo 'Nada nuevo'
          git push
