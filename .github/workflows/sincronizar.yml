name: Separar y Sincronizar M3U desde Dropbox

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  sync_and_split:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Descargar lista completa desde Dropbox
        run: |
          # Enlace directo optimizado para evitar bloqueos del servidor
          curl -L -o completa.m3u "https://dl.dropboxusercontent.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk"

      - name: Separar M3U en TV, Películas y Series
        run: |
          # Crear cabeceras estándar para los 3 archivos m3u
          echo "#EXTM3U" > tv.m3u
          echo "#EXTM3U" > peliculas.m3u
          echo "#EXTM3U" > series.m3u

          # Script en Python optimizado usando tu estructura exacta
          python3 -c "
          import re
          import os

          if not os.path.exists('completa.m3u'):
              print('Error: completa.m3u no encontrado.')
              exit(1)

          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          current_extinf = None
          
          for line in lines:
              line_strip = line.strip()
              if not line_strip:
                  continue
              
              if line_strip.startswith('#EXTINF:'):
                  # Limpieza quirúrgica: Borramos logos e imágenes de la cabecera del canal
                  linea_limpia = re.sub(r'tvg-logo=\".*?\"', '', line_strip)
                  linea_limpia = re.sub(r'tvg-image=\".*?\"', '', linea_limpia)
                  linea_limpia = re.sub(r'logo=\".*?\"', '', linea_limpia)
                  
                  # Limpiamos espacios dobles que dejen los reemplazos
                  current_extinf = re.sub(r'\s+', ' ', linea_limpia).strip() + '\n'
                  
              elif line_strip.startswith('http'):
                  if current_extinf:
                      url_low = line_strip.lower()
                      
                      # Clasificación por patrones comunes
                      if '/movie/' in url_low:
                          # Para películas borramos también el grupo para dejarlo ultra ligero
                          peli_limpia = re.sub(r'group-title=\".*?\"', '', current_extinf)
                          peli_limpia = re.sub(r',\s*', ',', peli_limpia).strip() + '\n'
                          with open('peliculas.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(peli_limpia + line_strip + '\n')
                              
                      elif '/series/' in url_low:
                          # Para series borramos el grupo
                          serie_limpia = re.sub(r'group-title=\".*?\"', '', current_extinf)
                          serie_limpia = re.sub(r',\s*', ',', serie_limpia).strip() + '\n'
                          with open('series.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(serie_limpia + line_strip + '\n')
                              
                      else:
                          # TV EN VIVO: Se guarda manteniendo estrictamente su category/group-title original sin logos
                          with open('tv.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(current_extinf + line_strip + '\n')
                              
                      current_extinf = None
          "
          # Eliminar el archivo pesado original
          rm -f completa.m3u

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add tv.m3u peliculas.m3u series.m3u
          git commit -m "Listas divididas: TV con categorias y limpia de logos" || exit 0
          git push origin HEAD:${{ github.ref_name }} --force
