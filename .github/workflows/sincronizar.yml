name: Separar y Sincronizar M3U
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrado de alta precision
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          # Usamos un script de Python que solo busca el nopor y lo elimina
          # SIN tocar ninguna otra línea, manteniendo intactos los group-title
          python3 -c "
          nopor = ['xxx', 'adult', 'only', 'porno', 'gays', 'pornbox', 'x4', 'stars exclusive', 'verified amateurs', 'lesbian', 'milf', 'mofos', 'sex', 'anal', 'boobs']
          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f_in, \
               open('tv.m3u', 'w', encoding='utf-8') as f_out:
              skip = False
              for line in f_in:
                  if '#EXTINF:' in line:
                      if any(p in line.lower() for p in nopor):
                          skip = True
                          continue
                      else:
                          skip = False
                  if skip and line.startswith('http'):
                      skip = False
                      continue
                  if not skip:
                      f_out.write(line)
          "
          rm completa.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u
          git commit -m 'Lista limpia manteniendo categorías originales' || echo 'Nada nuevo'
          git push
