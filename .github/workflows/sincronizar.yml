name: Sincronizar TV Limpia
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Limpieza 100% Original
        run: |
          curl -L -o tv.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          # Lista de palabras a borrar
          nopor="xxx\|adult\|only\|porno\|gays\|pornbox\|x4\|stars exclusive\|verified amateurs\|lesbian\|milf\|mofos\|sex\|anal\|boobs"
          
          # Borramos solo las líneas que contienen las palabras nopor
          # -i: ignora mayúsculas, -v: invierte la selección (borra lo que coincide)
          grep -vEi "$nopor" tv.m3u > temp.m3u && mv temp.m3u tv.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u
          git commit -m 'Lista original limpia' || echo 'Nada nuevo'
          git push
