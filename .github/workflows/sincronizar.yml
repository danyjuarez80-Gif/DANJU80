name: Sincronizar M3U - Categorias Originales
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrado Maestro (Sin errores)
        run: |
          # Descarga la lista
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          # Definimos las palabras prohibidas sin comillas dobles internas
          NOPOR='xxx\|adult\|only\|porno\|gays\|pornbox\|x4\|stars exclusive\|verified amateurs\|lesbian\|milf\|mofos\|sex\|anal\|boobs'
          
          # Filtramos la lista completa
          # Esto elimina el bloque (EXTINF + la linea siguiente) si contiene la palabra
          # Usamos un archivo temporal para procesar
          grep -vEi "$NOPOR" completa.m3u > limpia.m3u
          
          # Ahora separamos por tipo basándonos en la URL original
          # Esto mantiene intactas todas tus etiquetas de categoría
          grep -i "/movie/" limpia.m3u > peliculas.m3u
          grep -i "/series/" limpia.m3u > series.m3u
          grep -vEi "/movie/\|/series/" limpia.m3u > tv.m3u
          
          # Limpieza
          rm completa.m3u limpia.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u peliculas.m3u series.m3u
          git commit -m 'Lista filtrada por grep' || echo 'Nada nuevo'
          git push
