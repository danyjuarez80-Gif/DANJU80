name: Separar, Limpiar y Sincronizar M3U desde Dropbox

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  sync_and_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Descargar lista completa desde Dropbox
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"

      - name: Ejecutar script de separación y limpieza
        run: |
          python3 procesar_lista.py
          rm -f completa.m3u

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add tv.m3u peliculas.m3u series.m3u
          git commit -m "Sincronización automatizada por script independiente" || exit 0
          git push origin HEAD:${{ github.ref_name }}
          
          git add tv.m3u peliculas.m3u series.m3u
          
          git commit -m "Sincronización forzada: Enlace SCL corregido" || exit 0
          git push origin HEAD:${{ github.ref_name }}
