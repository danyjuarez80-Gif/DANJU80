name: Separar, Limpiar y Sincronizar M3U desde Dropbox

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  sync_and_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Descargar lista completa desde Dropbox
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"

      - name: Separar M3U Limpiando Logos y Manteniendo Categorías
        run: |
          # Forzamos la creación limpia de los archivos temporales
          echo "#EXTM3U" > tv_tmp.m3u
          echo "#EXTM3U" > peliculas_tmp.m3u
          echo "#EXTM3U" > series_tmp.m3u

          cat << 'EOF' > ejecutar_filtro.py
          import re
          import os

          if not os.path.exists('completa.m3u') or os.path.getsize('completa.m3u') < 5000:
              print('Error: Archivo muy pequeño o inexistente.')
              exit(1)

          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              texto = f.read().replace('\r', '')

          lines = texto.split('\n')
          current_extinf = None
          
          for line in lines:
              line_strip = line.strip()
              if not line_strip:
                  continue
              
              if line_strip.startswith('#EXTINF:'):
                  current_extinf = line_strip
                      
              elif line_strip.startswith('http://') or line_strip.startswith('https://'):
                  if current_extinf:
                      # Extraer nombre final de forma segura
                      match_name = re.search(r',([^,]*)$', current_extinf)
                      match_duration = re.search(r'^#EXTINF:(\s*[-]?\d+)', current_extinf)
                      
                      duracion = match_duration.group(1) if match_duration else '-1'
                      nombre = match_name.group(1).strip() if match_name else 'Contenido Sin Nombre'
                      
                      url_lower = line_strip.lower()
                      
                      # Clasificación ultra flexible para películas y series
                      if '/movie/' in url_lower or '/movies/' in url_lower or 'movie' in url_lower:
                          linea_limpia = f'#EXTINF:{duracion},{nombre}\n'
                          with open('peliculas_tmp.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(linea_limpia + line_strip + '\n')
                              
                      elif '/series/' in url_lower or '/show/' in url_lower or 'series' in url_lower:
                          linea_limpia = f'#EXTINF:{duracion},{nombre}\n'
                          with open('series_tmp.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(linea_limpia + line_strip + '\n')
                              
                      else:
                          # TV EN VIVO: Buscar categoría con comillas dobles, simples o sin ellas
                          match_group = re.search(r'group-title=["\']?([^"\',]+)["\']?', current_extinf, re.IGNORECASE)
                          
                          if match_group:
                              categoria = match_group.group(1).strip()
                              linea_tv = f'#EXTINF:{duracion} group-title="{categoria}",{nombre}\n'
                          else:
                              linea_tv = f'#EXTINF:{duracion},{nombre}\n'
                              
                          with open('tv_tmp.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(linea_tv + line_strip + '\n')
                              
                      current_extinf = None
          EOF

          python3 ejecutar_filtro.py
          mv tv_tmp.m3u tv.m3u
          mv peliculas_tmp.m3u peliculas.m3u
          mv series_tmp.m3u series.m3u
          rm -f completa.m3u ejecutar_filtro.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git add tv.m3u peliculas.m3u series.m3u
          
          # Forzamos el commit eliminando filtros viejos
          git commit -m "Sincronizacion inteligente de listas m3u" || exit 0
          git push origin HEAD:${{ github.ref_name }}
