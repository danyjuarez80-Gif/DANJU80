name: Sincronizar M3U - Categorias Originales
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrado Quirurgico
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          python3 -c "
          nopor = ['xxx', 'adult', 'only', 'porno', 'gays', 'pornbox', 'x4', 'stars exclusive', 'verified amateurs', 'lesbian', 'milf', 'mofos', 'sex', 'anal', 'boobs']
          
          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()
              
          f_tv = open('tv.m3u', 'w', encoding='utf-8')
          f_peli = open('peliculas.m3u', 'w', encoding='utf-8')
          f_serie = open('series.m3u', 'w', encoding='utf-8')
          
          f_tv.write('#EXTM3U\n')
          f_peli.write('#EXTM3U\n')
          f_serie.write('#EXTM3U\n')
          
          skip = False
          for i in range(len(lines)):
              line = lines[i]
              if line.startswith('#EXTINF:'):
                  if any(p in line.lower() for p in nopor):
                      skip = True
                      continue
                  else:
                      skip = False
                      # Identificar si es peli, serie o TV basandose en la URL de la siguiente linea
                      if i+1 < len(lines):
                          url = lines[i+1].lower()
                          if '/movie/' in url: target = f_peli
                          elif '/series/' in url: target = f_serie
                          else: target
