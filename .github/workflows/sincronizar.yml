name: Separar y Sincronizar M3U desde Dropbox

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  sync_and_split:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista completa desde Dropbox
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"

      - name: Separar M3U en TV, Películas y Series
        run: |
          # Crear cabeceras estándar para los 3 archivos m3u
          echo "#EXTM3U" > tv.m3u
          echo "#EXTM3U" > peliculas.m3u
          echo "#EXTM3U" > series.m3u

          # Tu script original exacto, SOLO agrega la limpieza de logos mediante re.sub
          python3 -c "
          import re

          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          current_extinf = None
          
          for line in lines:
              line_strip = line.strip()
              if not line_strip:
                  continue
              
              if line_strip.startswith('#EXTINF:'):
                  # AGREGADO: Solo borra los logos e imágenes de la línea, lo demás se queda intacto
                  linea_limpia = re.sub(r'tvg-logo=\".*?\"', '', line)
                  linea_limpia = re.sub(r'tvg-image=\".*?\"', '', linea_limpia)
                  linea_limpia = re.sub(r'logo=\".*?\"', '', linea_limpia)
                  
                  current_extinf = linea_limpia
              elif line_strip.startswith('http'):
                  if current_extinf:
                      # Tu clasificación exacta por patrones de Xtream Codes
                      if '/movie/' in line_strip:
                          with open('peliculas.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(current_extinf + line)
                      elif '/series/' in line_strip:
                          with open('series.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(current_extinf + line)
                      else:
                          with open('tv.m3u', 'a', encoding='utf-8') as f_out:
                              f_out.write(current_extinf + line)
                      current_extinf = None
          "
          # Eliminar el archivo pesado original para no saturar el repositorio
          rm completa.m3u

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tv.m3u peliculas.m3u series.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Listas divididas actualizadas automáticamente sin logos" && git push)
