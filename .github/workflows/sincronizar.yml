name: Sincronizar - Solo Deportes y Mexico
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtro Selectivo (Deportes y Mexico)
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          # Creamos el archivo limpio iniciando con el encabezado
          echo "#EXTM3U" > tv.m3u
          
          # Usamos Python para extraer SOLO las categorías que contienen "deportes" o "mexico"
          # Esto mantiene intacta la estructura original de tus carpetas
          python3 -c "
          import re
          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()
          
          keywords = ['deportes', 'mexico']
          
          current_extinf = None
          for line in lines:
              if line.startswith('#EXTINF:'):
                  current_extinf = line
              elif line.startswith('http'):
                  if current_extinf and any(k in current_extinf.lower() for k in keywords):
                      with open('tv.m3u', 'a', encoding='utf-8') as f:
                          f.write(current_extinf + line)
                  current_extinf = None
          "
          rm completa.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u
          git commit -m 'Lista filtrada: Solo Deportes y Mexico' || echo 'Nada nuevo'
          git push
