name: Separar y Sincronizar M3U
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrar manteniendo formato original
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          python3 -c "
          import re
          # Lista negra de palabras nopor
          nopor = ['xxx', 'adult', 'only', 'porno', 'gays', 'pornbox', 'x4', 'stars exclusive', 'verified amateurs', 'lesbian', 'milf', 'mofos', 'sex', 'anal', 'boobs']
          
          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              # Leemos el archivo entero y lo dividimos por bloques #EXTINF
              content = f.read()
              bloques = re.split(r'(?=#EXTINF:)', content)
              
          with open('tv.m3u', 'w', encoding='utf-8') as f:
              f.write('#EXTM3U\n')
              for bloque in bloques:
                  if bloque.strip() and not any(p in bloque.lower() for p in nopor):
                      # Escribimos el bloque tal cual venía, respetando categorías y todo
                      f.write(bloque)
          "
          rm completa.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u
          git commit -m 'Lista filtrada respetando formato original' || echo 'Nada nuevo'
          git push
