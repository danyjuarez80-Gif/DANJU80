name: Sincronizar - Solo Deportes y Mexico
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtro Selectivo (Deportes y Mexico)
        run: |
          curl -L -o completa.m3u "https://www.dropbox.com/scl/fi/ew83hymmvlrfl5muiodhm/danju89.m3u?rlkey=xws5j2n3uwwnxf6gny7zo9xmk&st=icseqhgp&dl=1"
          
          python3 -c "
          import re
          with open('completa.m3u', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          
          # Bloque por bloque para no romper el formato
          bloques = re.split(r'(?=#EXTINF:)', content)
          
          # Lo que queremos mantener
          interes = ['deportes', 'mexico', 'liga', 'nba', 'nfl', 'mlb', 'formula', 'partidos', 'eventos', 'champion']
          
          with open('tv.m3u', 'w', encoding='utf-8') as f:
              f.write('#EXTM3U\n')
              for bloque in bloques:
                  if not bloque.strip(): continue
                  # Mantenemos el bloque solo si contiene alguna de nuestras palabras clave
                  # y NO contiene ninguna palabra nopor
                  if any(k in bloque.lower() for k in interes):
                      if not any(p in bloque.lower() for p in ['xxx', 'adult', 'porno', 'sex', 'boobs', 'milf']):
                          f.write(bloque)
          "
          rm completa.m3u
          
      - name: Subir cambios
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add tv.m3u
          git commit -m 'Filtrado selectivo: Deportes y Mexico' || echo 'Nada nuevo'
          git push
