# ... (tu configuración de triggers)
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Ejecutar script de ordenamiento
        run: python actualizar_lista.py

      - name: Commit y Push de archivos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Orden alfabético de categorías y canales" || echo "Sin cambios"
          git push
