name: Actualizar Listas
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Procesar
        run: |
          python actualizar_lista.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Organizacion de listas y mascaras" || echo "Sin cambios"
          git push
