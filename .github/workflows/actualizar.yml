name: Actualizar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Procesar listas
        run: python actualizar_lista.py
        
      - name: Commit y Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DANJU80
          git commit -m "Actualizacion de listas" || exit 0
          git push
