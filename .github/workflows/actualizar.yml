name: Actualizar Listas

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Procesar listas y aplicar mascara
        run: |
          python actualizar_lista.py

      - name: Commit y Push forzado
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Añadir cambios
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          
          # Commit solo si hay cambios reales
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automatica: listas y mascaras"
            git push --force origin main
          else
            echo "Sin cambios detectados, omitiendo push."
          fi
