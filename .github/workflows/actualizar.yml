name: Actualizar
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Procesar
        run: |
          python actualizar_lista.py
          git config user.name 'bot'
          git config user.email 'bot@bot.com'
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Actualizacion" || exit 0
          git push --force origin main
