name: Actualizar Listas
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Procesar Clasificación
        run: python actualizar_lista.py
        
      - name: Commit y Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python actualizar_lista.py
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Clasificación automática: TV, Peliculas, Series" || exit 0
          git push origin main
