name: Actualizar Listas

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Ejecutar script
        run: python actualizar_lista.py

      - name: Commit y Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Ignorar conflictos y forzar la subida
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Orden alfabetico" || echo "Sin cambios"
          git push origin main --force
