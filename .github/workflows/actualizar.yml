name: Actualizar Listas

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Ejecutar script de clasificación
        run: python actualizar_lista.py

      - name: Commit y Push de archivos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Actualizacion automatica: Separacion de listas" || echo "Sin cambios"
          git push
