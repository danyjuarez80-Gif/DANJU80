name: Actualizar Listas

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Ejecutar script
        run: python actualizar_lista.py
      - name: Commit y Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git commit -m "Actualizacion completa" || echo "Sin cambios"
          # La clave para evitar el error [rejected]
          git pull --rebase origin main
          git push origin main
