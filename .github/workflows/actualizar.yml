name: Actualizar Listas IPTV

on:
  push:
    paths:
      - 'dan88.txt'
      - 'actualizar_lista.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Ejecutar script de limpieza
        run: python actualizar_lista.py

      - name: Configurar usuario de git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Subir cambios al repositorio
        run: |
          git add DANJU80 DANJU_MOVIES DANJU_SERIES
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualizacion de listas" && git push)
