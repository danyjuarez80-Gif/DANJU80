name: Actualizar Listas

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada hora

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRÍTICO: Sin esto, GitHub bloquea el push
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true # Asegura que el bot tenga credenciales
      
      - name: Ejecutar script
        run: python actualizar_lista.py
      
      - name: Commit y Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Limpia el estado de Git antes de sincronizar
          git reset --hard origin/main || true
          git pull --rebase origin main || true
          
          git add .
          
          # Verifica si hay cambios antes de hacer commit
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automatica de listas"
            git push
          else
            echo "No hay cambios detectados, omitiendo push."
          fi
